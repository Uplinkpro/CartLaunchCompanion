name: Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "CLC_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test release source
        run: dotnet test CartLaunchCompanion.Avalonia.sln --configuration Release

      - name: Build portable packages
        shell: pwsh
        run: ./Publish-RC1.ps1 -Version $env:CLC_VERSION -OutputRoot "artifacts/$env:CLC_VERSION"

      - name: Sign runtime manifests
        shell: pwsh
        env:
          CLC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CLC_UPDATE_SIGNING_KEY_PEM }}
        run: |
          $root = "artifacts/$env:CLC_VERSION"
          dotnet run --project Build/CartLaunchCompanion.UpdateSigner -- "$root/windows/CartLaunchCompanion/System/Windows-x64" Windows-x64 $env:CLC_VERSION "$root/packages/update-win-x64.json"
          dotnet run --project Build/CartLaunchCompanion.UpdateSigner -- "$root/linux/CartLaunchCompanion/System/Linux-x64" Linux-x64 $env:CLC_VERSION "$root/packages/update-linux-x64.json"
          Compress-Archive -Path "$root/windows/CartLaunchCompanion/System/Windows-x64/*" -DestinationPath "$root/packages/runtime-win-x64.zip" -CompressionLevel Optimal
          tar -czf "$root/packages/runtime-linux-x64.tar.gz" -C "$root/linux/CartLaunchCompanion/System/Linux-x64" .
          $checksums = foreach ($file in Get-ChildItem "$root/packages" -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          Set-Content -LiteralPath "$root/packages/SHA256SUMS.txt" -Value $checksums -Encoding ASCII

      - name: Verify release assets
        shell: pwsh
        run: |
          $root = "artifacts/$env:CLC_VERSION/packages"
          $required = @(
            "CartLaunchCompanion-$env:CLC_VERSION-win-x64.zip",
            "CartLaunchCompanion-$env:CLC_VERSION-linux-x64.tar.gz",
            "CartLaunchCompanion-$env:CLC_VERSION-portable.zip",
            'runtime-win-x64.zip',
            'runtime-linux-x64.tar.gz',
            'update-win-x64.json',
            'update-linux-x64.json',
            'SHA256SUMS.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (!(Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Required release asset is missing or empty: $name"
            }
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "artifacts/$env:CLC_VERSION/packages" -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' $files --title "Cart Launch Companion $env:CLC_VERSION" --generate-notes --verify-tag
