name: Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "CLC_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build portable packages
        shell: pwsh
        run: ./Publish-RC1.ps1 -Version $env:CLC_VERSION -OutputRoot "artifacts/$env:CLC_VERSION"

      - name: Sign runtime manifests
        shell: pwsh
        env:
          CLC_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CLC_UPDATE_SIGNING_KEY_PEM }}
        run: |
          $root = "artifacts/$env:CLC_VERSION"
          dotnet run --project Build/CartLaunchCompanion.UpdateSigner -- "$root/windows/CartLaunchCompanion/System/Windows-x64" Windows-x64 $env:CLC_VERSION "$root/packages/update-win-x64.json"
          dotnet run --project Build/CartLaunchCompanion.UpdateSigner -- "$root/linux/CartLaunchCompanion/System/Linux-x64" Linux-x64 $env:CLC_VERSION "$root/packages/update-linux-x64.json"
          Compress-Archive -Path "$root/windows/CartLaunchCompanion/System/Windows-x64/*" -DestinationPath "$root/packages/runtime-win-x64.zip" -CompressionLevel Optimal
          tar -czf "$root/packages/runtime-linux-x64.tar.gz" -C "$root/linux/CartLaunchCompanion/System/Linux-x64" .

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' "artifacts/$env:CLC_VERSION/packages/*" --title "Cart Launch Companion $env:CLC_VERSION" --generate-notes --verify-tag
